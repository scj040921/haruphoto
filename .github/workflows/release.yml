name: Release haruphoto

on:
  push:
    tags:
      - 'V*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example V1.2.0'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT: PhotoAlbum.csproj
  RID: win-x64
  TFM: net8.0-windows10.0.26100.0

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }
          $version = $tag.TrimStart('v','V')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release tag: $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set project version
        shell: pwsh
        run: |
          [xml]$xml = Get-Content $env:PROJECT
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $property = $xml.Project.PropertyGroup | Select-Object -First 1
          if (-not $property.Version) { $property.AppendChild($xml.CreateElement('Version')) | Out-Null }
          if (-not $property.FileVersion) { $property.AppendChild($xml.CreateElement('FileVersion')) | Out-Null }
          $property.Version = '${{ steps.meta.outputs.version }}'
          $property.FileVersion = '${{ steps.meta.outputs.version }}.0'
          $xml.Save($env:PROJECT)

      - name: Build Release
        shell: pwsh
        run: |
          dotnet build $env:PROJECT -c Release -r $env:RID --self-contained true
          $out = "bin/Release/$env:TFM/$env:RID"
          if (-not (Test-Path "$out/PhotoAlbum.exe")) { throw 'PhotoAlbum.exe was not produced' }

      - name: Assemble packages
        shell: pwsh
        run: |
          ./tools/package.ps1 -AppOutput "bin/Release/$env:TFM/$env:RID" -Version '${{ steps.meta.outputs.version }}' -Tag '${{ steps.meta.outputs.tag }}'

      - name: Regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/Regression/Regression.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }

      - name: Verify standalone installer
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'release/setup-test.txt'
          $exe = Join-Path $PWD 'release/haruphoto-v${{ steps.meta.outputs.version }}-Setup.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test', $report -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw 'Installer validation failed; refusing to publish.' }

      - name: Verify update rollback and integrity
        shell: pwsh
        run: |
          ./tests/update-regression.ps1 -Package "release/haruphoto-v${{ steps.meta.outputs.version }}-portable.zip" -Version '${{ steps.meta.outputs.version }}'
          # Negative test cases intentionally invoke a failing child process.
          # Assertions throw on real failures; older tags leave that child's exit code behind.
          $global:LASTEXITCODE = 0

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.meta.outputs.tag }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --verify-tag --title "haruphoto ${{ steps.meta.outputs.version }}" --generate-notes
          }
          gh release upload $tag "release/haruphoto-v${{ steps.meta.outputs.version }}-Setup.exe" "release/haruphoto-v${{ steps.meta.outputs.version }}-portable.zip" release/SHA256SUMS.txt release/update.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; keep the release unpublished.' }
          gh release edit $tag --draft=false --latest
